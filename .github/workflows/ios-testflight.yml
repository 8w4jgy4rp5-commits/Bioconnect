# Builds the signed iPhone app on GitHub's Mac and uploads it to App Store
# Connect, where it appears in TestFlight. Run by hand only (Actions tab →
# "iOS TestFlight upload" → Run workflow).
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      App Store Connect API key ID (Admin access)
#   ASC_ISSUER_ID   its Issuer ID
#   ASC_KEY_P8      the whole .p8 file text, BEGIN/END lines included
#   APPLE_TEAM_ID   the 10-character Team ID from developer.apple.com
# Signing is automatic: Xcode makes the certificate and profile through the key.
name: iOS TestFlight upload

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # App Store Connect accepts only apps built with the iOS 26 SDK or later.
      - name: Use the newest Xcode 26
        run: |
          ls -d /Applications/Xcode_26*.app
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app tools
        working-directory: app
        run: npm ci
      - name: Build the app's game files
        run: node app/build-app.cjs
      - name: Copy them into the Xcode project
        working-directory: app
        run: npx cap sync ios
      - name: Put the API key where Xcode looks for it
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Archive (unsigned; signed for the App Store at export)
        working-directory: app/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Development signing would need a registered iPhone, so the archive
          # is left unsigned and the export step signs it for distribution.
          # Each upload needs a new build number.
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -60
          test "${PIPESTATUS[0]}" -eq 0
      - name: Sign for the App Store and upload
        working-directory: app/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -60
          test "${PIPESTATUS[0]}" -eq 0
      - name: Remove the key
        if: always()
        run: rm -rf ~/private_keys
