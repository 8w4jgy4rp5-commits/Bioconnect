<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bioconnect · C Dusk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0b1712; --bg2: #132a1f; --glass: rgba(255,255,255,.06); --edge: rgba(255,255,255,.10);
    --ink: #eef5ee; --mute: #8fa597; --mint: #6ef0a6; --amber: #ffb547; --red: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Outfit', system-ui, sans-serif; color: var(--ink);
    background:
      radial-gradient(60% 38% at 50% 52%, rgba(110,240,166,.13), transparent 70%),
      radial-gradient(140% 40% at 30% 112%, #1d3b2b 0 50%, transparent 50.5%),
      radial-gradient(120% 34% at 90% 110%, #183323 0 50%, transparent 50.5%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    display: flex; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  body::before { /* a few stars */
    content: ''; position: fixed; inset: 0 0 60% 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 72% 9%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 88% 26%, #fff, transparent), radial-gradient(1px 1px at 38% 6%, #fff, transparent), radial-gradient(1px 1px at 55% 30%, #fff, transparent);
  }
  .app { position: relative; width: 100%; max-width: 430px; min-height: 100dvh; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 14px; }

  .glass { background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

  .top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; }
  .round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); font-size: 16px; }
  .score { text-align: center; }
  .score b { display: block; font-size: 40px; font-weight: 300; letter-spacing: .02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .score span { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); }
  .season { justify-self: end; font-size: 12px; font-weight: 700; color: var(--amber); border-color: rgba(255,181,71,.35); }

  /* the ladder as silhouettes; reached ones lit */
  .ladder { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 16px; }
  .rung { width: 24px; height: 22px; display: grid; place-items: center; position: relative; }
  .rung img { width: 100%; height: 100%; object-fit: contain; filter: brightness(0) invert(1) opacity(.18); }
  .rung.is-done img { filter: none; }
  .rung.is-next img { filter: brightness(0) invert(1) opacity(.9) drop-shadow(0 0 6px var(--mint)); }
  .rung.is-next::after { content: ''; position: absolute; bottom: -7px; width: 4px; height: 4px; border-radius: 50%; background: var(--mint); }
  .goal-line { text-align: center; font-size: 14px; color: var(--mute); margin-top: -4px; }
  .goal-line b { color: var(--ink); font-weight: 600; }

  .board-wrap { flex: 1; display: flex; align-items: center; }
  .board { width: 100%; aspect-ratio: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 8px; border-radius: 24px; }
  .cell { position: relative; border-radius: 14px; background: rgba(255,255,255,.035); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); display: grid; place-items: center; }
  .cell.has { background: radial-gradient(80% 70% at 50% 60%, rgba(110,240,166,.12), rgba(255,255,255,.05)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.10); }
  .cell img { width: 86%; height: 86%; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,.45)); }
  .cell.k-sprout img, .cell.k-grass img { width: 54%; height: 54%; }
  .cell.is-preview { box-shadow: inset 0 0 0 1.5px rgba(110,240,166,.6), 0 0 18px rgba(110,240,166,.18); }
  .cell.is-preview img { opacity: .35; width: 64%; filter: none; }
  .cell.is-hungry { box-shadow: inset 0 0 0 1.5px rgba(255,107,107,.75), 0 0 20px rgba(255,107,107,.25); }
  .stone { width: 54%; height: 42%; border-radius: 45% 50% 40% 48%; background: linear-gradient(160deg, #56625a, #2b342e); }

  .toast { align-self: center; font-size: 13px; padding: 7px 14px; border-radius: 999px; color: #ffd0d0; border-color: rgba(255,107,107,.3); }

  .hand { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; border-radius: 26px; }
  .slot { width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; background: rgba(255,255,255,.05); }
  .slot img { width: 62%; height: 62%; object-fit: contain; }
  .slot.now { width: 70px; height: 70px; border-radius: 20px; background: rgba(110,240,166,.12); box-shadow: inset 0 0 0 1.5px var(--mint), 0 0 24px rgba(110,240,166,.3); }
  .slot.later { opacity: .45; }
  .hand small { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); writing-mode: vertical-rl; transform: rotate(180deg); }
  /* keep every square square, whatever the art inside */
  .board { grid-template-rows: repeat(5, 1fr); }
  .cell { min-width: 0; min-height: 0; }
  .cell img { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <span class="round glass" aria-label="Pause">❚❚</span>
    <div class="score"><b>4,210</b><span>Best 8,032</span></div>
    <span class="round glass season" aria-label="Summer, points times two">×2</span>
  </header>

  <section>
    <div class="ladder glass" id="ladder"></div>
  </section>
  <p class="goal-line">Second wolf → <b>Bear</b> · Summer</p>

  <div class="board-wrap"><div class="board glass" id="board"></div></div>

  <p class="toast glass">Wolf is hungry · feed it a rabbit</p>

  <section class="hand glass">
    <small>Hand</small>
    <span class="slot now"><img src="art/grass.png" alt="grass"></span>
    <span class="slot"><img src="art/rabbit.png" alt="rabbit"></span>
    <span class="slot later"><img src="art/sprout.png" alt="sprout"></span>
  </section>
</main>
<script src="_board.js"></script>
<script>drawBoard(document.getElementById('board')); drawLadder(document.getElementById('ladder'));</script>
</body>
</html>
