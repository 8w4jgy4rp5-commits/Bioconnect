<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Special+Elite&display=swap">
<link rel="stylesheet" href="common.css">
<title>G. Field Journal</title><style>
/* The naturalist's notebook, opened on the desk at night: a page of
   taped-in plates and typed notes, lit by one lamp from the top. */
body { background: #0f120c; }
.paper { position: absolute; inset: 10px; border-radius: 4px;
  background: radial-gradient(70% 50% at 50% 30%, #efe6c8, #d6c79e 80%, #b9a979);
  box-shadow: 0 0 0 1px #6d6040, 0 10px 40px rgba(0,0,0,.6); }
.paper::before { content: ""; position: absolute; inset: 0; border-radius: 4px; opacity: .5;
  background: repeating-linear-gradient(transparent 0 27px, rgba(80,100,120,.18) 27px 28px); }
.paper::after { content: ""; position: absolute; top: 64%; left: 66%; width: 80px; height: 60px; border-radius: 50%; background: rgba(120,90,40,.12); }
.stage { color: #2a2418; padding: 22px 26px 24px; }
.kicker, .pill { color: #5c5236; }
.pill { background: rgba(60,50,30,.1); box-shadow: inset 0 0 0 1px rgba(60,50,30,.3); }
.pill b { color: #2a2418; }
.shop { color: #3a2440; background: rgba(107,74,114,.12); box-shadow: inset 0 0 0 1px rgba(107,74,114,.5); }
.logo { color: #2a2418; text-shadow: none; margin-top: 3vh; }
.tagline { background: none; padding: 0; color: #4a4128; margin-top: 4px; }
.notes { position: relative; flex: 1; min-height: 0; margin: 4px -6px 6px; container-type: size; }
.plate { position: absolute; left: var(--x); top: var(--y); width: var(--w); rotate: var(--r);
  background: #f8f2de; padding: 7px 7px 22px; box-shadow: 0 3px 8px rgba(40,30,10,.35); }
.plate::before { content: ""; position: absolute; top: -8px; left: 30%; width: 40%; height: 16px; background: rgba(220,210,170,.75); rotate: -3deg; }
.plate div { width: 100%; aspect-ratio: 1.2; display: grid; place-items: center; background: #2b3822; overflow: hidden; }
.plate img { height: 82%; max-width: 92%; object-fit: contain; filter: saturate(.7) sepia(.3); }
.plate span { position: absolute; bottom: 5px; left: 0; right: 0; text-align: center; font-family: var(--type); font-size: .55rem; color: #3a3220; }
.note { position: absolute; left: var(--x); top: var(--y); margin: 0; width: var(--w); font-family: var(--type); font-size: .62rem; line-height: 1.45; color: #3a3220; rotate: var(--r); }
.note em { color: #8a2f20; font-style: normal; }
.arrow { position: absolute; inset: 0; width: 100%; height: 100%; }
.arrow path { fill: none; stroke: #5c5236; stroke-width: 1.2; stroke-dasharray: 3 3; }
.play { background: #4d6a2a; color: #f1ead0; box-shadow: 0 5px 0 #2f441a, 0 8px 16px rgba(40,30,10,.3); }
.icon { background: rgba(60,50,30,.12); color: #2a2418; box-shadow: inset 0 0 0 1px rgba(60,50,30,.35); }
.foot { color: #5c5236; }
.sprout path { stroke: #4d6a2a; }
</style></head><body><div class="paper"></div><div class="stage">
<div data-top></div>
<h1 data-logo></h1>
<p class="tagline">Grow a food chain, then keep it fed.</p>
<div class="notes" aria-hidden="true">
  <svg class="arrow" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M30 30 C40 40 48 44 56 46"/><path d="M42 74 C52 70 56 66 60 60"/></svg>
  <div class="plate" style="--x:2%;--y:4%;--w:34%;--r:-4deg"><div><img src="../../img/rabbit-pose.png" alt=""></div><span>fig. 3 — rabbit</span></div>
  <div class="plate" style="--x:52%;--y:28%;--w:44%;--r:3deg"><div><img src="../../img/elephant-calm.png" alt=""></div><span>fig. 12 — ???</span></div>
  <div class="plate" style="--x:6%;--y:56%;--w:34%;--r:2deg"><div><img src="../../img/fox-pose.png" alt=""></div><span>fig. 4 — fox</span></div>
  <p class="note" style="--x:40%;--y:4%;--w:56%;--r:1deg">eats grass. eats sprouts.<br>panics easily. relatable.</p>
  <p class="note" style="--x:44%;--y:84%;--w:54%;--r:-1deg">two of a kind become<br>something larger. <em>do not<br>ask how.</em></p>
</div>
<div data-controls></div>
</div><script src="common.js"></script></body></html>
