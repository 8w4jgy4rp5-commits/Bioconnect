<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Special+Elite&display=swap">
<link rel="stylesheet" href="common.css">
<title>E. Board of Eyes</title><style>
/* The board itself, tipped back into the dark: animals in some squares,
   eyes blinking in the empty ones, the title floating over it. */
.board { position: absolute; inset: -60px -70px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 6px; align-content: center;
  transform: rotate(-7deg); }
.c { position: relative; aspect-ratio: 1; border-radius: 10px; background: var(--cell); box-shadow: inset 0 0 0 1px rgba(168,198,108,.12); display: grid; place-items: center; }
.c.up { background: var(--cell-up); }
.c img { height: 76%; min-width: 0; max-width: 92%; object-fit: contain; filter: saturate(.6) sepia(.28) brightness(.8); }
.c .e { width: 46%; height: 26%; border-radius: 50%; background: #e9e1c4; position: relative; animation: blink var(--b, 4s) infinite var(--bd, 0s); }
.c .e::after { content: ""; position: absolute; top: 18%; left: var(--p, 38%); width: 34%; height: 64%; border-radius: 50%; background: #10150e; }
.veil { position: absolute; inset: 0; background: radial-gradient(95% 34% at 50% 26%, rgba(16,21,14,.94) 35%, rgba(16,21,14,.3) 75%, transparent),
  linear-gradient(transparent 52%, rgba(16,21,14,.96) 80%); }
.hero { position: relative; margin-top: 9vh; }
.spacer { flex: 1; }
</style></head><body>
<div class="board" id="board" aria-hidden="true"></div><div class="veil"></div>
<div class="stage">
<div data-top></div>
<div class="hero"><h1 data-logo></h1><p class="tagline">Grow a food chain, then keep it fed.</p></div>
<div class="spacer"></div>
<div data-controls="(the empty squares are watching.)"></div>
</div><script src="common.js"></script><script>
const pics = {3:'rabbit-pose',8:'fox-pose',13:'zebra-calm',16:'elephant-calm',20:'lion-calm',27:'deer-calm',31:'wolf-calm',34:'rabbit-pose',38:'bear-calm',47:'tiger-calm',56:'deer-calm',63:'fox-pose',72:'buffalo-calm',77:'rabbit-pose'};
const eyes = {1:1,6:1,10:1,18:1,23:1,25:1,29:1,33:1,40:1,50:1,53:1,58:1,61:1,66:1,70:1,75:1,80:1};
const b = document.getElementById('board');
for (let i = 0; i < 84; i++) {
  const c = document.createElement('div'); c.className = 'c' + ((i * 7) % 5 === 0 ? ' up' : '');
  if (pics[i]) { const im = document.createElement('img'); im.src = '../../img/' + pics[i] + '.png'; im.alt = ''; c.appendChild(im); }
  else if (eyes[i]) { const e = document.createElement('i'); e.className = 'e';
    e.style.setProperty('--b', (3 + (i % 4)) + 's'); e.style.setProperty('--bd', ((i % 3) * -0.7) + 's'); e.style.setProperty('--p', (i % 3 ? 38 : 8) + '%'); c.appendChild(e); }
  b.appendChild(c);
}
</script></body></html>
