<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Special+Elite&display=swap">
<link rel="stylesheet" href="common.css">
<title>I. Underground</title><style>
/* A slice through the meadow. Above: the herd under the moon. Below:
   roots, old stones, and something large and asleep. The title is
   carved into the soil between them. */
body { background: #120e0a; }
.sky { position: absolute; left: 0; right: 0; top: 0; height: 40%; background: linear-gradient(#141b22, #1b2418); }
.sky .moon { position: absolute; right: 14%; top: 26%; width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #f4efd8 0 40%, #cfc7a2 72%); box-shadow: 0 0 26px 6px rgba(241,234,208,.16); }
.soil { position: absolute; left: 0; right: 0; top: 40%; bottom: 0;
  background: linear-gradient(#2a3a1c 0 10px, #3a2b1c 10px, #2a1f14 40%, #1a130c 75%, #120e0a); }
.soil svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.root { fill: none; stroke: #5a4630; stroke-linecap: round; }
.stone { fill: #3c362d; } .bone { fill: #9c937a; }
.sleeper { fill: none; stroke: var(--plum); stroke-width: 7; stroke-linecap: round; opacity: .9; }
.zz { position: absolute; font-family: var(--type); font-size: .7rem; color: var(--plum2); animation: drift 3s ease-in-out infinite; }
.herd { position: absolute; left: 0; right: 0; top: 0; height: 40%; container-type: size; pointer-events: none; }
.crit { left: var(--x); bottom: 0; translate: -50% 0; height: var(--h); }
.stage { justify-content: space-between; }
.carved { margin-top: 35vh; }
.carved .logo { color: #d9cfae; text-shadow: 0 -1px 0 rgba(0,0,0,.8), 0 1px 0 rgba(255,240,200,.18), 0 0 18px rgba(168,198,108,.2); }
.carved .tagline { background: rgba(0,0,0,.3); }
</style></head><body>
<div class="sky" aria-hidden="true"><div class="moon"></div></div>
<div class="soil" aria-hidden="true">
  <svg viewBox="0 0 100 100" preserveAspectRatio="none">
    <path class="root" stroke-width=".9" d="M20 0 C22 10 16 16 18 26 M18 12 C12 16 10 20 6 22 M70 0 C68 8 74 14 72 24 M72 10 C78 14 82 14 86 20 M44 0 C46 6 42 10 44 16"/>
    <ellipse class="stone" cx="84" cy="44" rx="6" ry="3"/><ellipse class="stone" cx="12" cy="60" rx="4" ry="2.4"/>
    <path class="bone" d="M60 66 h12 a1.6 1.6 0 1 1 0 2 h-12 a1.6 1.6 0 1 1 0 -2z"/>
  </svg>
  <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="height:100%"><path class="sleeper" vector-effect="non-scaling-stroke" d="M104 58 C90 52 80 64 68 58 C58 53 62 44 70 47 C75 49 72 55 67 53"/></svg>
  <span class="zz" style="left:52%;top:50%">z z z</span>
</div>
<div class="herd" aria-hidden="true">
  <img class="crit" src="../../img/elephant-calm.png" alt="" style="--x:30%;--h:40cqh">
  <img class="crit" src="../../img/zebra-calm.png" alt="" style="--x:58%;--h:42cqh;--d:.7s">
  <img class="crit" src="../../img/fox-pose.png" alt="" style="--x:80%;--h:18cqh;--d:1.3s">
  <img class="crit" src="../../img/rabbit-pose.png" alt="" style="--x:92%;--h:17cqh;--d:1.8s">
</div>
<div class="stage">
<div data-top></div>
<div class="carved"><h1 data-logo></h1><p class="tagline">Grow a food chain, then keep it fed.</p></div>
<div data-controls="(don’t wake it. it’s been a long winter.)"></div>
</div><script src="common.js"></script></body></html>
