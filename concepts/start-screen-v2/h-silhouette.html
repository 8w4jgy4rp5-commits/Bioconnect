<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Special+Elite&display=swap">
<link rel="stylesheet" href="common.css">
<title>H. Moon Silhouette</title><style>
/* A poster: one huge moon, the whole herd cut out in black against it,
   and pairs of eyes in the dark grass that were not invited. */
body { background: linear-gradient(#1a2028, #10150e 75%); }
.hero { margin-top: 3vh; }
.scene { position: relative; flex: 1; min-height: 0; margin: 8px -18px 0; container-type: size; }
.moon { position: absolute; left: 50%; top: 4%; width: min(86cqw, 80cqh); aspect-ratio: 1; translate: -50% 0; border-radius: 50%;
  background: radial-gradient(circle at 42% 40%, #f6f1dc 0 30%, #e3dab6 60%, #cbc19a);
  box-shadow: 0 0 80px 20px rgba(241,234,208,.12); }
.moon::before, .moon::after { content: ""; position: absolute; border-radius: 50%; background: rgba(140,130,95,.18); }
.moon::before { width: 20%; height: 20%; top: 18%; left: 22%; } .moon::after { width: 12%; height: 12%; top: 30%; left: 66%; }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; width: 100%; }
.crit { left: var(--x); bottom: var(--y); translate: -50% 0; height: var(--h); filter: brightness(0); }
.eyes { position: absolute; left: var(--x); bottom: var(--y); display: flex; gap: 5px; animation: blink 4.5s infinite var(--d, 0s); }
.eyes i { width: 6px; height: 4px; border-radius: 50%; background: var(--moss); box-shadow: 0 0 6px var(--moss); }
.eyes.r i { background: #e9c46a; box-shadow: 0 0 6px #e9c46a; }
</style></head><body><div class="stage">
<div data-top></div>
<div class="hero"><h1 data-logo></h1><p class="tagline">Grow a food chain, then keep it fed.</p></div>
<div class="scene" aria-hidden="true">
  <div class="moon"></div>
  <img class="crit" src="../../img/elephant-calm.png" alt="" style="--x:60%;--y:24%;--h:34cqh">
  <img class="crit" src="../../img/zebra-calm.png" alt="" style="--x:33%;--y:25%;--h:34cqh;--d:.7s">
  <img class="crit" src="../../img/lion-calm.png" alt="" style="--x:15%;--y:22%;--h:20cqh;--d:1.1s">
  <img class="crit" src="../../img/rabbit-pose.png" alt="" style="--x:86%;--y:22%;--h:11cqh;--d:1.6s">
  <svg class="ground" viewBox="0 0 100 30" preserveAspectRatio="none"><path d="M0 12 C20 4 40 10 60 7 C80 4 90 9 100 12 V30 H0Z" fill="#000"/>
    <path d="M0 18 C14 12 30 20 50 16 C70 12 84 20 100 16 V30 H0Z" fill="#0b0e09"/></svg>
  <span class="eyes" style="--x:8%;--y:6%"><i></i><i></i></span>
  <span class="eyes r" style="--x:44%;--y:3%;--d:-1.5s"><i></i><i></i></span>
  <span class="eyes" style="--x:78%;--y:7%;--d:-3s"><i></i><i></i></span>
</div>
<div data-controls></div>
</div><script src="common.js"></script></body></html>
