<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Special+Elite&display=swap">
<link rel="stylesheet" href="common.css">
<title>F. Tentacle Curtain</title><style>
/* A little night theatre. Plum tentacles hold the curtains open, a
   spotlight falls on the herd, and one tentacle offers a sprout. */
body { background: #0d100b; }
.stage { gap: 0; }
.spot { position: absolute; left: 50%; top: 0; width: 120%; height: 78%; translate: -50% 0; pointer-events: none;
  background: conic-gradient(from 180deg at 50% 0%, transparent 157deg, rgba(241,234,208,.13) 168deg 192deg, transparent 203deg); }
.curtain { position: absolute; top: 0; bottom: 0; width: 30%; background: repeating-linear-gradient(90deg, #3a2440 0 10px, #4a2f52 10px 22px, #331f39 22px 30px);
  box-shadow: inset 0 0 30px rgba(0,0,0,.6); }
.curtain.l { left: 0; border-radius: 0 0 70% 0 / 0 0 22% 0; clip-path: polygon(0 0, 100% 0, 34% 60%, 0 100%); }
.curtain.r { right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 66% 60%); }
.valance { position: absolute; top: 0; left: 0; right: 0; height: 26px;
  background: radial-gradient(circle at 50% 0, #4a2f52 70%, transparent 71%) 0 0 / 34px 26px repeat-x; }
.tent { position: absolute; width: 46%; height: 50%; pointer-events: none; overflow: visible; }
.tent path { fill: none; stroke: var(--plum2); stroke-linecap: round; }
.tent .suck { fill: #b997bf; stroke: none; opacity: .7; }
.tent.l { left: -4%; top: 30%; } .tent.r { right: -4%; top: 30%; transform: scaleX(-1); }
.hero { position: relative; margin-top: 4vh; }
.marquee { margin: 0 auto 6px; width: fit-content; font-family: var(--type); font-size: .62rem; letter-spacing: .2em; color: var(--mute); }
.floor { position: relative; flex: 1; min-height: 0; container-type: size; }
.floor .boards { position: absolute; left: 6%; right: 6%; bottom: 0; height: 20%; border-radius: 50% 50% 0 0 / 30% 30% 0 0;
  background: repeating-linear-gradient(90deg, #2b2216 0 22px, #241c12 22px 24px); box-shadow: inset 0 3px 0 rgba(241,234,208,.15); }
.crit { left: var(--x); bottom: var(--y); translate: -50% 0; height: var(--h); }
.offer { position: absolute; right: 2%; bottom: 0; width: 30%; height: 34%; overflow: visible; animation: drift 3s ease-in-out infinite; }
.offer path { fill: none; stroke: var(--plum2); stroke-width: 7; stroke-linecap: round; }
</style></head><body>
<div class="spot"></div>
<div class="curtain l"></div><div class="curtain r"></div><div class="valance"></div>
<svg class="tent l" viewBox="0 0 100 100" aria-hidden="true"><path d="M-10 20 C30 30 40 70 70 66 C92 62 86 40 72 44 C62 47 66 58 74 56" stroke-width="8"/>
  <circle class="suck" cx="30" cy="36" r="2"/><circle class="suck" cx="40" cy="52" r="2"/><circle class="suck" cx="54" cy="64" r="2"/></svg>
<svg class="tent r" viewBox="0 0 100 100" aria-hidden="true"><path d="M-10 26 C30 30 44 76 72 70 C94 64 88 42 74 46 C64 49 68 60 76 58" stroke-width="8"/>
  <circle class="suck" cx="30" cy="40" r="2"/><circle class="suck" cx="42" cy="58" r="2"/><circle class="suck" cx="56" cy="69" r="2"/></svg>
<div class="stage">
<div data-top></div>
<div class="hero"><p class="marquee">TONIGHT ONLY · AND EVERY NIGHT</p><h1 data-logo></h1><p class="tagline">Grow a food chain, then keep it fed.</p></div>
<div class="floor" aria-hidden="true">
  <div class="boards"></div>
  <img class="crit" src="../../img/elephant-calm.png" alt="" style="--x:54%;--y:12%;--h:46cqh">
  <img class="crit" src="../../img/rabbit-pose.png" alt="" style="--x:28%;--y:10%;--h:18cqh;--d:1s">
  <img class="crit" src="../../img/fox-pose.png" alt="" style="--x:80%;--y:10%;--h:17cqh;--d:1.6s">
</div>
<div data-controls="(applause is optional. it is watching anyway.)"></div>
</div><script src="common.js"></script></body></html>
