<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bioconnect · Promo intro</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Special+Elite&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b120e;color:#e9e2c8;font:16px/1.5 system-ui,sans-serif}
main{display:grid;justify-items:center;gap:14px;padding:16px}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:inherit;color:#1d2a1f;background:#e9d58c;border:0;border-radius:12px;min-height:44px;padding:8px 16px;font-weight:700;cursor:pointer}
button.ghost{background:#2a3a2d;color:#e9e2c8}
#status{min-height:24px;font-size:14px;color:#a9b89c}
.frame{width:min(92vw,calc((100vh - 140px) * 9 / 16));aspect-ratio:9/16;position:relative;overflow:hidden;border-radius:14px;box-shadow:0 0 0 1px #2c3b2e}
body.render main{padding:0}
body.render .controls,body.render #status{display:none}
body.render .frame{width:1080px;border-radius:0;box-shadow:none}

/* the 1080×1920 stage, scaled into the frame */
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;--pulse:1}
#stage>*{position:absolute;left:0;top:0;will-change:transform,opacity}
.pi-bg{width:100%;height:100%;background:radial-gradient(ellipse at 50% 52%,#2c4a33 0%,#16281b 45%,#0a120c 100%);transform:scale(var(--pulse))!important;transform-origin:50% 50%}
.pi-fog{width:900px;height:600px;border-radius:50%;background:radial-gradient(closest-side,#6b5a8c55,#6b5a8c00);filter:blur(30px)}
.pi-fog--b{background:radial-gradient(closest-side,#3f6d4d66,#3f6d4d00)}
.pi-eye{width:64px;height:40px;border-radius:50%;background:#f3ecd2;box-shadow:0 0 22px #e6d58a66;overflow:hidden;display:grid;place-items:center}
.pi-pupil{width:22px;height:22px;border-radius:50%;background:#1a1410}
.pi-eye--0{left:110px!important;top:1650px!important}.pi-eye--1{left:980px!important;top:1180px!important;width:46px;height:30px}
.pi-eye--2{left:130px!important;top:480px!important;width:40px;height:26px}.pi-eye--3{left:960px!important;top:1760px!important}
.pi-tagline{left:540px!important;top:150px!important;transform:translate(-50%,-50%)!important;font:400 74px/1 'IM Fell English',Georgia,serif;font-style:italic;color:#e9dfb8;white-space:nowrap;text-shadow:0 4px 18px #000}
.pi-ladder{left:540px!important;top:260px!important;transform:translate(-50%,-50%)!important;display:flex;gap:6px}
.pi-slot{width:80px;height:80px;border-radius:18px;overflow:hidden;background:#0e1a12cc;box-shadow:inset 0 0 0 2px #3b5340;position:relative;display:grid;place-items:center}
.pi-slot-img{width:112px;height:112px;flex:none;filter:brightness(0) opacity(.45);transition:none}
.pi-slot.is-lit .pi-slot-img{filter:none}
.pi-slot.is-now{box-shadow:inset 0 0 0 4px #ffd75e,0 0 26px #ffd75e88}
.pi-slot-q{position:absolute;inset:0;display:grid;place-items:center;font:700 54px/1 'Special Elite',monospace;color:#c9a8ff}
.pi-slot.is-next{box-shadow:inset 0 0 0 4px #b98cff,0 0 34px #b98cffaa}
.pi-tile{filter:drop-shadow(0 18px 18px #0009)}
.pi-tile[style*="--twin"] .tile-art{animation-delay:-.7s!important}
.pi-ring{width:420px;height:420px;border-radius:50%;border:16px solid #fff3c4;box-shadow:0 0 40px #ffe58a}
.pi-burst{width:520px;height:520px;border-radius:50%;background:radial-gradient(closest-side,#fff8dcee,#ffd96a88 45%,#ffd96a00)}
.pi-spark{width:30px;height:30px;background:#ffe9a0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 8px #ffd75e)}
.pi-name{font:400 120px/1 'IM Fell English SC','IM Fell English',Georgia,serif;color:#f5e9bd;white-space:nowrap;text-shadow:0 6px 24px #000,0 0 30px #ffd75e44;letter-spacing:.02em}
.pi-dim{width:100%;height:100%;background:radial-gradient(ellipse at 50% 45%,#1d0f2e55,#05020acc)}
.pi-ghost{width:760px;height:auto;filter:brightness(0) drop-shadow(0 0 30px #b98cff) drop-shadow(0 0 70px #7a4fd0)}
.pi-next{font:400 150px/1 'IM Fell English',Georgia,serif;font-style:italic;color:#f2e6ff;white-space:nowrap;text-shadow:0 0 30px #b98cff,0 6px 20px #000}
.pi-q{font:700 260px/1 'Special Elite',monospace;color:#d6bcff;text-shadow:0 0 40px #9d6cff}
.pi-flash{width:100%;height:100%;background:#fff;opacity:0}
#stage.is-frozen .pi-tile{filter:drop-shadow(0 18px 18px #0009) saturate(.5) brightness(.75)}
</style>
<body>
<main>
  <div class="controls">
    <button id="intro">▶ Intro (music + pops)</button>
    <button id="bgm" class="ghost">♪ BGM only</button>
    <button id="stop" class="ghost">■ Stop</button>
  </div>
  <p id="status" role="status">Original score “Tiptoe Hollow”. Press a button.</p>
  <div class="frame" id="frame"><div id="stage"></div></div>
</main>
<script src="promo-audio.js"></script>
<script src="promo-art.js"></script>
<script src="promo-intro.js"></script>
<script>
(async () => {
  const stage = document.getElementById('stage'), frame = document.getElementById('frame'), status = document.getElementById('status');
  const isRender = new URLSearchParams(location.search).has('render');
  if (isRender) document.body.classList.add('render');
  status.textContent = 'Loading the animals from the game…';
  await PromoArt.ready();
  status.textContent = 'Original score “Tiptoe Hollow”. Press a button.';
  PromoIntro.mount(stage);
  const fit = () => { stage.style.transform = 'scale(' + frame.clientWidth / 1080 + ')'; };
  addEventListener('resize', fit); fit();
  PromoIntro.render(0);

  let ctx, sound, raf = 0, t0 = 0, bgmTimer = 0;
  async function audio() { ctx ||= new (window.AudioContext || window.webkitAudioContext)(); await ctx.resume(); return ctx; }
  function stop() {
    cancelAnimationFrame(raf); raf = 0; clearTimeout(bgmTimer);
    if (sound) sound.stopAll(ctx.currentTime); sound = null;
  }
  document.getElementById('intro').addEventListener('click', async () => {
    stop(); await audio();
    t0 = ctx.currentTime + .15;
    sound = PromoSound.scheduleIntro(ctx, t0, PromoIntro.CUE);
    status.textContent = 'Intro playing…';
    const tick = () => {
      const t = ctx.currentTime - t0;
      PromoIntro.render(Math.max(0, Math.min(t, PromoIntro.DURATION)));
      if (t < PromoIntro.DURATION + .3) raf = requestAnimationFrame(tick); else status.textContent = 'Intro done. Press again to replay.';
    };
    tick();
  });
  document.getElementById('bgm').addEventListener('click', async () => {
    stop(); await audio();
    sound = PromoSound.scheduleLoop(ctx, ctx.currentTime + .1, 2);
    status.textContent = 'BGM: two times through the 16-second loop.';
    bgmTimer = setTimeout(() => { status.textContent = 'BGM done.'; }, PromoSound.LOOP_BEATS * PromoSound.BEAT * 2000 + 500);
  });
  document.getElementById('stop').addEventListener('click', () => { stop(); status.textContent = 'Stopped.'; });

  // for render.cjs: draw any moment, and render the soundtrack offline
  window.promoFrame = t => { PromoIntro.render(t); PromoArt.seek(t); };
  window.promoReady = true;
  window.promoAudio = async (which) => {
    const rate = 48000, intro = which === 'intro';
    const secs = intro ? PromoIntro.DURATION + 1.5 : PromoSound.LOOP_BEATS * PromoSound.BEAT * 2 + 2.5;
    const off = new OfflineAudioContext(2, Math.ceil(rate * secs), rate);
    if (intro) PromoSound.scheduleIntro(off, 0, PromoIntro.CUE); else PromoSound.scheduleLoop(off, 0, 2);
    const buf = await off.startRendering();
    const L = buf.getChannelData(0), R = buf.getChannelData(1), n = buf.length;
    const out = new DataView(new ArrayBuffer(44 + n * 4));
    const str = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
    str(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt '); out.setUint32(16, 16, true);
    out.setUint16(20, 1, true); out.setUint16(22, 2, true); out.setUint32(24, rate, true); out.setUint32(28, rate * 4, true);
    out.setUint16(32, 4, true); out.setUint16(34, 16, true); str(36, 'data'); out.setUint32(40, n * 4, true);
    let peak = 0;
    for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
    for (let i = 0, o = 44; i < n; i++, o += 4) {
      out.setInt16(o, Math.max(-1, Math.min(1, L[i])) * 32767, true);
      out.setInt16(o + 2, Math.max(-1, Math.min(1, R[i])) * 32767, true);
    }
    let bin = ''; const bytes = new Uint8Array(out.buffer);
    for (let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
    return { wav: btoa(bin), peak };
  };
})();
</script>
</body>
</html>
