<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Bioconnect — Start C (Living board)</title>
<style>
/* ============================================================
   Sample C — "Living board"
   No separate artwork: the real board is the poster. Behind a paper
   scrim the meadow keeps playing itself — tiles settle in, a sprout
   becomes grass, a rabbit appears — and the start card sits on top of
   it like a lid. The player sees the actual game before pressing Play.
   ============================================================ */
:root{
  --ink:#3c4a36; --ink-soft:#6d7a66; --ink-faint:#9aa593;
  --paper:#f7f9f0; --card:#fff; --ground:#e9f0dc; --ground-deep:#dde8cc; --line:#d3e0be;
  --green:#5a9e4b; --green-deep:#41773a; --green-bright:#7ec05c; --warm:#e08a4a;
  --font:"Hiragino Sans","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--paper);overflow:hidden}
.sprite-defs{position:absolute;width:0;height:0;overflow:hidden}

.screen{position:relative;height:100%;min-height:100svh;overflow:hidden;display:grid;align-items:end}

/* ---- the board playing itself ---- */
.board{
  position:absolute;inset:-8% -6% 16%;display:grid;gap:8px;
  grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;
  padding:14px;border-radius:24px;background:var(--ground-deep);
  transform:rotate(-3deg) scale(1.04)}
.cell{position:relative;border-radius:12px;background:var(--ground);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
  animation:settle 9s ease-in-out infinite;animation-delay:var(--d,0s)}
.cell svg{position:absolute;inset:14%;width:72%;height:72%}
.cell .b{opacity:0;animation:swapIn 9s ease-in-out infinite;animation-delay:var(--d,0s)}
.cell .a{animation:swapOut 9s ease-in-out infinite;animation-delay:var(--d,0s)}
.scrim{position:absolute;inset:0;
  background:
    radial-gradient(120% 70% at 50% 0%,rgba(247,249,240,.14),rgba(247,249,240,.6) 66%),
    linear-gradient(rgba(247,249,240,.34) 0%,rgba(247,249,240,.7) 52%,var(--paper) 82%)}

/* ---- top ---- */
.topline{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:18px;right:18px;
  display:flex;align-items:center;justify-content:space-between}
.brand{margin:0;color:var(--ink-faint);font-size:.66rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.best{margin:0;color:var(--ink-soft);font-size:.74rem;font-weight:600}
.best b{color:var(--ink)}

/* ---- start card ---- */
.card{
  position:relative;margin:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);
  padding:26px 22px 22px;text-align:center;background:var(--card);
  border:1px solid var(--line);border-radius:26px;
  box-shadow:0 -2px 0 rgba(255,255,255,.9),0 22px 52px rgba(60,74,54,.18);
  animation:sheet .7s cubic-bezier(.2,.9,.25,1) both}
.chainstrip{display:flex;align-items:center;justify-content:center;gap:5px;margin:0 0 16px;color:var(--ink-faint)}
.chainstrip svg{width:24px;height:24px}
.chainstrip span{font-size:.7rem;font-weight:700}
.logo{margin:0;font-size:clamp(2rem,10vw,2.7rem);letter-spacing:-.035em;line-height:1;white-space:nowrap}
.logo .chip{
  display:inline-grid;place-items:center;width:.84em;height:.84em;margin:0 .03em;vertical-align:-.05em;
  border-radius:.2em;background:var(--ground);border:1px solid var(--line);
  box-shadow:0 2px 0 var(--ground-deep)}
.logo .chip svg{width:88%;height:88%;animation:pulse 4.5s ease-in-out infinite}
.copy{margin:14px auto 20px;max-width:27ch;color:var(--ink-soft);font-size:.9rem;line-height:1.6}
.play{width:100%;min-height:56px;border:0;border-radius:16px;cursor:pointer;font-family:inherit;
  font-size:1.08rem;font-weight:800;letter-spacing:.04em;color:#fff;
  background:linear-gradient(#7ec05c,#5a9e4b);box-shadow:0 4px 0 var(--green-deep),0 10px 22px rgba(65,119,58,.24);
  transition:transform .12s,box-shadow .12s}
.play:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-deep)}
.play:focus-visible{outline:3px solid var(--warm);outline-offset:3px}
.row{display:flex;gap:10px;margin-top:10px}
.ghost{flex:1;min-height:44px;border-radius:14px;cursor:pointer;font-family:inherit;font-size:.84rem;
  font-weight:700;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line)}
.ghost:hover{color:var(--ink);border-color:#bcd4a2}
.ghost:focus-visible{outline:3px solid var(--green);outline-offset:2px}

@keyframes settle{0%,8%{transform:scale(.9);opacity:0}16%,100%{transform:scale(1);opacity:1}}
@keyframes swapOut{0%,44%{opacity:1}54%,96%{opacity:0}100%{opacity:1}}
@keyframes swapIn{0%,44%{opacity:0}54%,96%{opacity:1}100%{opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes sheet{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.cell .b{display:none}}
</style>
</head>
