<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Bioconnect — Start B (Nightfall)</title>
<style>
/* ============================================================
   Sample B — "Nightfall"
   The meadow after dark. Fireflies, a silhouetted treeline, and the
   twelve steps of the chain drawn as a glowing arc so the player sees
   the goal before the first tap. Quiet, premium, one warm light source.
   ============================================================ */
:root{
  --night:#141f16; --night-2:#1d2b1e; --mist:#2b3c2b;
  --paper:#f3f6ea; --soft:#b7c6b0; --faint:#7d8f7b;
  --green:#7ec05c; --warm:#e8a765; --gold:#f0c98a;
  --font:"Hiragino Sans","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--paper);background:var(--night);overflow:hidden}
.sprite-defs{position:absolute;width:0;height:0;overflow:hidden}

.screen{
  position:relative;height:100%;min-height:100svh;overflow:hidden;
  display:grid;grid-template-rows:auto 1fr auto;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);
  background:
    radial-gradient(90% 60% at 50% 34%,rgba(232,167,101,.16),rgba(232,167,101,0) 70%),
    radial-gradient(120% 90% at 50% 120%,#24351f 0%,rgba(36,53,31,0) 60%),
    linear-gradient(#101a12 0%,#1a2719 58%,#22321f 100%);
}
.vignette{position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 120px 40px rgba(8,14,9,.72)}
.treeline{position:absolute;left:0;right:0;bottom:0;width:100%;height:15%;opacity:.85;pointer-events:none;z-index:0}
.fly{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 10px 3px rgba(240,201,138,.5);opacity:0;
  animation:glow var(--t,7s) ease-in-out infinite;animation-delay:var(--d,0s)}

/* ---- top ---- */
.topline{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between}
.brand{margin:0;color:var(--faint);font-size:.66rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.best{color:var(--soft);font-size:.72rem;letter-spacing:.06em}
.best b{color:var(--gold);font-weight:700}

/* ---- hero ---- */
.hero{position:relative;z-index:2;display:grid;align-content:center;justify-items:center;gap:26px;text-align:center}
.kicker{margin:0;color:var(--warm);font-size:.68rem;font-weight:700;letter-spacing:.34em;text-transform:uppercase;
  animation:fade 1s .1s both}
.logo{margin:0;font-size:clamp(2.5rem,15vw,3.9rem);font-weight:300;letter-spacing:.02em;line-height:1;
  animation:fade 1.2s .2s both}
.logo b{font-weight:700}
.logo .glow{color:var(--gold);text-shadow:0 0 26px rgba(240,201,138,.45)}
.rule{width:132px;height:1px;background:linear-gradient(90deg,transparent,var(--warm),transparent);
  animation:fade 1.2s .4s both}
.copy{margin:0;max-width:26ch;color:var(--soft);font-size:.88rem;line-height:1.65;animation:fade 1.2s .5s both}

/* the chain, drawn as an arc of lit animals */
.arc{position:relative;width:min(100%,340px);height:96px;animation:fade 1.4s .6s both}
.arc svg.path{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;top:var(--y);left:var(--x);width:40px;height:40px;margin:-20px 0 0 -20px;
  display:grid;place-items:center;border-radius:50%;
  background:radial-gradient(circle at 50% 30%,#2f4230,#1b281b);
  border:1px solid rgba(240,201,138,.22);box-shadow:0 0 18px rgba(240,201,138,.1);
  transform:scale(var(--sc,1));
  animation:lantern 5.5s ease-in-out infinite;animation-delay:var(--d,0s)}
.node svg{width:74%;height:74%;filter:saturate(.72) brightness(.92)}
.node--goal{width:54px;height:54px;margin:-27px 0 0 -27px;border-color:rgba(240,201,138,.5);
  box-shadow:0 0 30px rgba(240,201,138,.3)}

/* ---- controls ---- */
.controls{position:relative;z-index:2;display:grid;gap:14px;justify-items:center;animation:fade 1.4s .8s both}
.play{width:min(100%,320px);min-height:56px;border-radius:999px;cursor:pointer;font-family:inherit;
  font-size:1.02rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#18240f;
  background:linear-gradient(#f2cf94,#e8a765);border:0;
  box-shadow:0 0 40px rgba(232,167,101,.28),0 10px 24px rgba(0,0,0,.4);
  transition:transform .14s,box-shadow .14s}
.play:hover{transform:translateY(-1px);box-shadow:0 0 54px rgba(232,167,101,.4),0 12px 28px rgba(0,0,0,.44)}
.play:active{transform:translateY(1px)}
.play:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.links{display:flex;gap:22px}
.link{padding:6px 2px;border:0;background:none;cursor:pointer;font-family:inherit;font-size:.78rem;
  font-weight:600;letter-spacing:.06em;color:var(--soft);border-bottom:1px solid rgba(183,198,176,.28)}
.link:hover{color:var(--gold);border-color:rgba(240,201,138,.5)}
.link:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

@keyframes glow{0%,100%{opacity:0;transform:translateY(0)}45%{opacity:.9}70%{opacity:.2;transform:translateY(-14px)}}
@keyframes lantern{0%,100%{box-shadow:0 0 14px rgba(240,201,138,.08)}50%{box-shadow:0 0 26px rgba(240,201,138,.22)}}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
