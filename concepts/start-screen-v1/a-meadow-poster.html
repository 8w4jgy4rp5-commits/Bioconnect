<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Bioconnect — Start A (Meadow poster)</title>
<style>
/* ============================================================
   Sample A — "Meadow poster"
   A full-bleed painted meadow: sky, two hills, animals grazing.
   The wordmark is a chunky cream sign standing in the grass, and
   Play is a pressable pill with a real bottom edge. Casual-puzzle
   storefront look, built only from the palette the game already uses.
   ============================================================ */
:root{
  --ink:#3c4a36; --ink-soft:#6d7a66; --ink-faint:#9aa593;
  --paper:#f7f9f0; --card:#fff; --line:#d3e0be;
  --green:#5a9e4b; --green-deep:#41773a; --green-bright:#7ec05c; --warm:#e08a4a;
  --font:"Hiragino Sans","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:#e4f0cf;overflow:hidden}
.sprite-defs{position:absolute;width:0;height:0;overflow:hidden}

.screen{
  position:relative;height:100%;min-height:100svh;overflow:hidden;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 20px);
  background:linear-gradient(#e8f4fb 0%,#f2f9e8 38%,#e7f2d3 100%);
}

/* ---- painted scene ---- */
.scene{position:absolute;inset:0;pointer-events:none}
.sun{position:absolute;top:8%;right:12%;width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle,#fff6d8 0%,#ffe9a8 55%,rgba(255,233,168,0) 72%)}
.cloud{position:absolute;height:20px;border-radius:999px;background:#fff;opacity:.75;
  box-shadow:22px 6px 0 -3px #fff,-20px 5px 0 -4px #fff}
.cloud--1{top:11%;left:8%;width:66px;animation:drift 34s linear infinite}
.cloud--2{top:19%;left:52%;width:46px;opacity:.6;animation:drift 46s linear infinite}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:52%}
.fade{position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;
  background:linear-gradient(rgba(231,242,211,0),rgba(231,242,211,.72) 42%,rgba(231,242,211,.94) 100%)}
.tufts{position:absolute;left:0;right:0;bottom:0;width:100%;height:16%}
.critter{position:absolute;width:var(--s,68px);height:var(--s,68px);
  filter:drop-shadow(0 6px 10px rgba(60,74,54,.16));
  animation:bob 4.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.critter--elephant{--s:122px;right:-4px;bottom:25%}
.critter--deer{--s:80px;left:1%;bottom:32%}
.critter--rabbit{--s:50px;left:41%;bottom:27%}
.critter--fox{--s:58px;left:20%;bottom:23%}

/* ---- top row ---- */
.topline{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{margin:0;color:var(--ink-faint);font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.best{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  background:rgba(255,255,255,.82);border:1px solid var(--line);box-shadow:0 2px 0 rgba(60,74,54,.08);
  font-size:.74rem;font-weight:700;color:var(--ink-soft)}
.best b{color:var(--ink);font-size:.92rem}

/* ---- wordmark ---- */
.hero{position:relative;display:grid;place-content:center;justify-items:center;text-align:center}
.logo{
  position:relative;margin:0;line-height:.86;letter-spacing:-.045em;
  font-size:clamp(3rem,20vw,4.6rem);color:#fffdf4;
  -webkit-text-stroke:5px var(--green-deep);paint-order:stroke fill;
  text-shadow:0 7px 0 rgba(65,119,58,.32),0 16px 26px rgba(60,74,54,.2);
  transform:rotate(-2.2deg);animation:rise .8s cubic-bezier(.2,.9,.25,1) both}
.logo span{display:block}
.logo .lo2{margin-top:.02em;font-size:.82em}
.sprout{width:.42em;height:.52em;vertical-align:-.04em;margin-right:.02em;
  animation:sway 5s ease-in-out infinite;transform-origin:50% 100%}
.tagline{margin:16px 0 0;padding:7px 15px;border-radius:999px;background:rgba(255,255,255,.72);
  color:var(--ink-soft);font-size:.86rem;font-weight:600;
  animation:rise .8s .12s cubic-bezier(.2,.9,.25,1) both}

/* ---- controls ---- */
.controls{position:relative;display:grid;gap:12px;justify-items:center;
  animation:rise .8s .2s cubic-bezier(.2,.9,.25,1) both}
.play{
  width:min(100%,330px);min-height:62px;border:0;border-radius:18px;cursor:pointer;
  font-family:inherit;font-size:1.22rem;font-weight:800;letter-spacing:.06em;color:#fff;
  background:linear-gradient(#7ec05c,#5a9e4b);
  box-shadow:0 6px 0 var(--green-deep),0 14px 24px rgba(65,119,58,.3);
  transition:transform .12s,box-shadow .12s}
.play:active{transform:translateY(5px);box-shadow:0 1px 0 var(--green-deep),0 6px 12px rgba(65,119,58,.26)}
.play:focus-visible{outline:3px solid var(--warm);outline-offset:3px}
.minor{display:flex;gap:10px}
.icon{width:50px;height:50px;border-radius:15px;cursor:pointer;font-family:inherit;
  font-size:1.05rem;font-weight:700;color:var(--ink-soft);background:rgba(255,255,255,.85);
  border:1px solid var(--line);box-shadow:0 3px 0 rgba(60,74,54,.1)}
.icon:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(60,74,54,.1)}
.icon:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.foot{margin:2px 0 0;color:var(--ink-soft);font-size:.7rem}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes drift{from{transform:translateX(-12vw)}to{transform:translateX(112vw)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) rotate(-2.2deg)}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
